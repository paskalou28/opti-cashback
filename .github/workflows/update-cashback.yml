name: Auto Update Cashback Rates

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installation des dépendances
        run: npm install

      - name: Exécution du scraper
        run: node scripts/scrape.js

      - name: Commit et Push si modifications
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add src/data/merchants.json
          git diff-index --quiet HEAD || (git commit -m "chore: mise à jour automatique des taux cashback" && git push)